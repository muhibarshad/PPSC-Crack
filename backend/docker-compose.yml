# ──────────────────────────────────────────────────────────
# PPSC Crack — Local Development Services
# ──────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d          # start all services
#   docker compose down           # stop all services
#   docker compose down -v        # stop + wipe volumes
#   docker compose logs -f db     # tail postgres logs
# ──────────────────────────────────────────────────────────

services:
  # ── PostgreSQL 16 + pgvector ──────────────────────────────
  db:
    image: pgvector/pgvector:pg16
    container_name: ppsc_crack_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ppsc_crack
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ppsc_crack"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ── Redis 7 (caching, rate-limiting, Celery broker) ───────
  redis:
    image: redis:7-alpine
    container_name: ppsc_crack_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
